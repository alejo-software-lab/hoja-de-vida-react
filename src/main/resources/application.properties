# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration (H2 in-memory for development)
spring.datasource.url=jdbc:h2:mem:cvdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (enable for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mail Configuration (Web3Forms HTTP API)
web3forms.access-key=${WEB3FORMS_ACCESS_KEY:}

# Application Mail Settings
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:alejosoftwarelabs@gmail.com}
app.mail.to=${MAIL_TO:alejosoftwarelabs@gmail.com}

# CORS Configuration (use env var for production)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Error details
server.error.include-message=always
server.error.include-binding-errors=always

# Logging
logging.level.com.alejosoftware.cv=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n