version: '3.8'

services:
  # Backend Java Spring Boot
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cv-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_TO=${MAIL_TO:-alejosoftwarelabs@gmail.com}
      - MAIL_ENABLED=${MAIL_ENABLED:-true}
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80,https://localhost
    volumes:
      - ./backend-data:/data
    networks:
      - cv-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/contact/count"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend React + Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cv-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cv-network
    restart: unless-stopped

  # Opcional: Base de datos PostgreSQL para producción
  # database:
  #   image: postgres:16-alpine
  #   container_name: cv-db
  #   environment:
  #     - POSTGRES_DB=cvdb
  #     - POSTGRES_USER=cvuser
  #     - POSTGRES_PASSWORD=${DB_PASSWORD:-cvpass123}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - cv-network
  #   restart: unless-stopped

networks:
  cv-network:
    driver: bridge

